spring.datasource.url=jdbc:postgresql://localhost:5433/carRentalTest
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED

jwt.secret=test-secret-key-for-tests-only-not-used-in-race-condition-test

spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration