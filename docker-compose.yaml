services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - minio_data:/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - pg-network

  db:
    image: postgres:16
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - pg-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # db-test:
  #   image: postgres:16
  #   ports:
  #     - "5433:5432"
  #   environment:
  #     POSTGRES_PASSWORD: test
  #     POSTGRES_DB: carRentalTest
  #     POSTGRES_USER: test
  #   networks:
  #     - pg-network

networks:
  pg-network:
volumes:
  postgres_data:
  minio_data: